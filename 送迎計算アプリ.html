<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送迎計算アプリ | 放課後等デイサービス</title>
<style>
:root{--pr:#1a5276;--prl:#2980b9;--sec:#e8f4fc;--acc:#e74c3c;--ok:#27ae60;--warn:#f39c12;--tx:#2c3e50;--bd:#d5d8dc;--bg:#f4f6f9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo UI','Meiryo','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
header{background:var(--pr);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px}
header .sub{font-size:11px;opacity:.8}
nav{background:#fff;border-bottom:2px solid var(--bd);display:flex;overflow-x:auto}
.nb{padding:12px 18px;border:none;background:none;cursor:pointer;font-size:14px;font-family:inherit;color:#666;border-bottom:3px solid transparent;white-space:nowrap}
.nb.active{color:var(--pr);border-bottom-color:var(--pr);font-weight:bold}
.nb:hover{background:var(--sec)}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
.ct{font-size:15px;font-weight:bold;color:var(--pr);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--sec);display:flex;align-items:center;gap:6px}
.fr{display:grid;gap:12px;margin-bottom:12px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:1fr 1fr 1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:12px;color:#666}
.fg input,.fg select{padding:8px 10px;border:1px solid var(--bd);border-radius:4px;font-size:14px;font-family:inherit}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--prl);box-shadow:0 0 0 2px rgba(41,128,185,.15)}
.hint{font-size:11px;color:#999;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.85}
.bp{background:var(--pr);color:#fff}
.bs{background:#e0e0e0;color:#333}
.bd2{background:var(--acc);color:#fff}
.bok{background:var(--ok);color:#fff}
.bw{background:var(--warn);color:#fff}
.sm{padding:5px 10px;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--pr);color:#fff;padding:8px 6px;text-align:center;font-weight:500}
.tbl td{padding:7px 6px;border:1px solid #e8e8e8;text-align:center}
.tbl tbody tr:hover td{background:var(--sec)}
.tbl .tr td{background:#fff3cd;font-weight:bold;border-top:2px solid var(--warn)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.bp2{background:#e3f2fd;color:#1565c0}
.bd3{background:#fce4ec;color:#880e4f}
.bg2{background:#e8f5e9;color:#2e7d32}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.ov.open{display:flex}
.modal{background:#fff;border-radius:8px;padding:24px;width:90%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.mt{font-size:16px;font-weight:bold;color:var(--pr);margin-bottom:16px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.rb{border:1px solid var(--bd);border-radius:6px;padding:12px;margin:10px 0}
.rs{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rs select{flex:1;padding:7px;border:1px solid var(--bd);border-radius:4px;font-size:13px;font-family:inherit}
.ib{border-radius:6px;padding:12px 14px;margin:8px 0}
.ic{background:#e8f5e9;border-left:4px solid var(--ok)}
.iw{background:#fff3e0;border-left:4px solid var(--warn)}
.ii{background:var(--sec);border-left:4px solid var(--prl)}
.cr{display:flex;justify-content:space-between;padding:3px 0}
.cr.tot{font-weight:bold;font-size:15px;border-top:1px solid var(--bd);margin-top:4px;padding-top:8px}
.mx th,.mx td{border:1px solid var(--bd);padding:5px 7px;font-size:12px}
.mx th{background:var(--pr);color:#fff;min-width:75px;text-align:center}
.mx td{min-width:75px;text-align:center}
.mx .dg{background:#f0f0f0}
.mx input{width:68px;padding:4px;border:1px solid var(--bd);border-radius:3px;text-align:center;font-size:12px}
.dn-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.dn-wrap input[type=date]{padding:8px 12px;border:1px solid var(--bd);border-radius:4px;font-size:15px;font-family:inherit;font-weight:bold}
.tc{border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tc .rt{flex:1;font-size:13px;min-width:160px}
.tc .am{text-align:right;font-size:13px}
.dn{color:var(--acc);font-size:12px}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2c3e50;color:#fff;padding:12px 18px;border-radius:6px;font-size:13px;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px;align-items:start}
.box{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:14px;border-top:4px solid var(--pr)}
.box-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:10px;font-size:16px;font-weight:bold}
.box-h small{font-size:12px;font-weight:normal;color:#888;text-align:right}
.bin{border:1px solid var(--bd);border-radius:6px;padding:10px;margin-bottom:10px}
.bin-new{border-style:dashed;background:#fcfcfd}
.bin-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
.bin-stop{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.bin-lbl{font-size:11px;color:#666;min-width:40px}
.bin-stop select{flex:1;min-width:0;padding:7px;border:1px solid var(--bd);border-radius:4px;font-size:14px;font-family:inherit;background:#fff}
.bin-stop select.bin-cat{flex:none;width:112px;font-size:12px;padding:7px 2px;background:#f4f6f9}
.bin-stop{gap:4px}
.bin-stop select.empty{border-color:var(--warn);color:#b9770e;background:#fffaf0}
.bin-x{width:28px;height:28px;flex:none;border:none;border-radius:50%;background:#f5d5d1;color:var(--acc);cursor:pointer;font-size:15px}
.bin-x-sp{width:28px;flex:none}
.bin-sum{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:13px;padding-top:6px;border-top:1px dashed var(--bd)}
.bin-warn{color:#b9770e;font-size:11px;margin-top:4px}
@media(max-width:900px){.boxes{grid-template-columns:1fr}}
.dh{display:inline-block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:6px 10px;margin:-6px 4px -6px -4px;color:#999;font-size:16px;border-radius:4px}
.dh:hover{background:var(--sec);color:var(--pr)}
#loc-tbody tr.dragging td{opacity:.35}
#loc-tbody tr.drop-before td{box-shadow:inset 0 3px 0 var(--prl)}
#loc-tbody tr.drop-after td{box-shadow:inset 0 -3px 0 var(--prl)}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
@media(max-width:600px){.c2,.c3{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>

<header>
  <div style="font-size:24px">🚌</div>
  <div>
    <h1>送迎計算アプリ</h1>
    <div class="sub">放課後等デイサービス 私有車使用実績報告書</div>
  </div>
</header>

<nav>
  <button class="nb active" onclick="showTab('daily')">📅 日次入力</button>
  <button class="nb" onclick="showTab('locations')">📍 場所マスタ</button>
  <button class="nb" onclick="showTab('settings')">⚙️ 基本設定</button>
  <button class="nb" onclick="showTab('report')">📊 月次レポート</button>
</nav>

<main>
  <div id="panel-daily"></div>
  <div id="panel-locations" class="hidden"></div>
  <div id="panel-settings" class="hidden"></div>
  <div id="panel-report" class="hidden"></div>
</main>

<!-- Trip modal -->
<div class="ov" id="trip-modal">
  <div class="modal">
    <div class="mt" id="trip-modal-title">送迎記録を追加</div>
    <div id="trip-modal-body"></div>
    <div class="mf">
      <button class="btn bs" onclick="closeModal('trip-modal')">キャンセル</button>
      <button class="btn bp" onclick="saveTrip()">保存して閉じる</button>
    </div>
  </div>
</div>

<!-- Edit location modal -->
<div class="ov" id="edit-loc-modal">
  <div class="modal">
    <div class="mt">場所を編集</div>
    <input type="hidden" id="edit-loc-id">
    <div class="fr"><div class="fg"><label>名前</label><input id="edit-loc-name"></div></div>
    <div class="fr"><div class="fg"><label>住所（距離の自動計算に使用）</label><input id="edit-loc-address" placeholder="例: 茨城県筑西市○○1-2-3"></div></div>
    <div class="fr"><div class="fg"><label>位置（緯度, 経度）※住所で位置が正しく出ないときだけ</label>
      <input id="edit-loc-pos" placeholder="例: 36.18011, 139.96327">
      <div class="hint">① <a id="edit-loc-maplink" href="#" target="_blank" rel="noopener">Googleマップを開く</a>
        ② 家や学校の上で右クリック（スマホは長押し）
        ③ 出てきた数字（例: 36.18011, 139.96327）をクリックするとコピーされるので、ここに貼り付け<br>
        位置を指定すると、その場所の自動計算の距離は消えるので、もう一度「未設定の距離を住所から自動計算」を押してください。</div>
    </div></div>
    <div class="mf">
      <button class="btn bs" onclick="closeModal('edit-loc-modal')">キャンセル</button>
      <button class="btn bp" onclick="saveEditLoc()">保存</button>
    </div>
  </div>
</div>

<!-- Location modal -->
<div class="ov" id="loc-modal">
  <div class="modal">
    <div class="mt">場所を追加</div>
    <div class="fr"><div class="fg"><label>場所の名前 *</label><input id="loc-name" placeholder="例: A小学校、田中さん宅"></div></div>
    <div class="fr c2">
      <div class="fg"><label>種別</label><select id="loc-type"><option value="school">学校</option><option value="child_home">児童宅</option><option value="other">その他</option></select></div>
    </div>
    <div class="fr"><div class="fg"><label>住所（距離の自動計算に使用、任意）</label><input id="loc-address" placeholder="例: 茨城県結城市○○1-2-3"></div></div>
    <div class="fr"><div class="fg"><label>追加する位置</label><select id="loc-pos"></select>
      <div class="hint">あとから一覧の左端の ☰ をつかんで、ドラッグでも並べ替えできます。</div></div></div>
    <div class="mf">
      <button class="btn bs" onclick="closeModal('loc-modal')">キャンセル</button>
      <button class="btn bp" onclick="saveLocation()">追加</button>
    </div>
  </div>
</div>

<script>
const DB_KEY = 'sougeicalc_v2';

function defaultState() {
  return {
    settings: { facilityName:'', staffName:'', fuelPrice:160, fuelEfficiency:23, commuteDistance:0, fixedRate:10, useFixedRate:false, commuteRate:10 },
    locations: [
      { id:'facility', name:'事業所', type:'facility', address:'' },
      { id:'home',     name:'自宅',   type:'home',     address:'' }
    ],
    distances: {},
    manualDist: {},   // 手入力した区間（再計算で上書きしない）
    confirmedDist: {},// 担当者が確認した区間 {km, at}。距離が変わると自動的に未確認に戻る
    records: {}
  };
}

let state = defaultState();
let currentDate = todayStr();
let eTripEdit = null;
let eTripRoute = ['facility','facility'];
let eTripType = 'pickup';
let eTripManual = null;

// ローカル時刻で日付文字列を作る（toISOStringはUTCなので朝9時前に前日になる）
function ymd(dt) { return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function todayStr() { return ymd(new Date()); }

function loadState() {
  try { const s=localStorage.getItem(DB_KEY); if(s) state={...defaultState(),...JSON.parse(s)}; } catch(e){}
  if(!state.manualDist) state.manualDist={};
  if(!state.confirmedDist) state.confirmedDist={};
}

// この場所に関係する距離データを削除（IDの部分一致ではなく完全一致で判定）
function clearDistFor(id) {
  Object.keys(state.distances).forEach(k=>{
    const [a,b]=k.split('|');
    if(a===id||b===id){ delete state.distances[k]; delete state.manualDist[k]; delete state.confirmedDist[k]; }
  });
}
// 住所が変わったら座標と自動計算した距離を捨てる
function onAddrChanged(loc, newAddr) {
  if((loc.address||'')===newAddr) return;
  loc.address=newAddr;
  delete loc.lat; delete loc.lon; delete loc.geoAddr; delete loc.geoTitle; delete loc.geoRough; delete loc.snapM; delete loc.geoManual;
  clearDistFor(loc.id);
}
function saveState() { localStorage.setItem(DB_KEY,JSON.stringify(state)); }

// ── Calculations ──────────────────────────────────────────
function ratePerKm() {
  const s=state.settings;
  if(s.useFixedRate) return s.fixedRate||0;
  return s.fuelEfficiency>0 ? Math.ceil(s.fuelPrice/s.fuelEfficiency) : 0;
}
function commuteDed() { return state.settings.commuteDistance * (state.settings.commuteRate||0); }

function getDist(a,b) {
  if(a===b) return 0;
  const k1=a+'|'+b, k2=b+'|'+a;
  if(state.distances[k1]!=null) return state.distances[k1];
  if(state.distances[k2]!=null) return state.distances[k2];
  return null;
}

// 確認したときの距離と今の距離が同じなら「確認済み」
function confirmInfo(a,b) { return state.confirmedDist[a+'|'+b]||state.confirmedDist[b+'|'+a]||null; }
function isConfirmed(a,b) {
  if(a===b) return true;
  const c=confirmInfo(a,b), d=getDist(a,b);
  return !!c && d!=null && c.km===d;
}

function calcRoute(route) {
  let total=0, missing=[], unconf=[];
  for(let i=0;i<route.length-1;i++){
    const d=getDist(route[i],route[i+1]);
    if(d!==null){ total+=d; if(!isConfirmed(route[i],route[i+1])) unconf.push([route[i],route[i+1]]); }
    else missing.push([route[i],route[i+1]]);
  }
  return {total,missing,unconf};
}

function calcTrip(trip) {
  const route=trip.route.filter(Boolean);
  const rate=ratePerKm();
  let distance, missing=[], unconf=[];
  const manual=trip.manualDistance!=null;
  if(manual) { distance=trip.manualDistance; }
  else { const r=calcRoute(route); distance=r.total; missing=r.missing; unconf=r.unconf; }
  const sendAmt=Math.round(distance*rate);
  const startsHome=route[0]==='home';
  const endsHome=route[route.length-1]==='home';
  const hasDeduction=startsHome||endsHome;
  const ded=hasDeduction?commuteDed():0;
  const paidAmt=Math.max(0,sendAmt-ded);
  return {distance,sendAmt,ded,paidAmt,missing,unconf,manual,startsHome,endsHome,hasDeduction};
}
function legsTxt(legs) { return legs.map(([a,b])=>locName(a)+'↔'+locName(b)).join('、'); }

function locName(id) { const l=state.locations.find(x=>x.id===id); return l?l.name:id; }
function N(n) { return Number(n).toLocaleString('ja-JP'); }
function D(km) { return km.toFixed(1)+'km'; }
function typeName(t) { return {pickup:'迎え',dropoff:'送り',outing:'外出'}[t]||t; }
function typeBadge(t) {
  const cls={pickup:'bp2',dropoff:'bd3',outing:'bg2'}[t]||'';
  return `<span class="badge ${cls}">${typeName(t)}</span>`;
}

// ── Navigation ────────────────────────────────────────────
function showTab(name) {
  ['daily','locations','settings','report'].forEach(t=>{
    document.getElementById('panel-'+t).classList.toggle('hidden',t!==name);
  });
  document.querySelectorAll('.nb').forEach((b,i)=>{
    b.classList.toggle('active',['daily','locations','settings','report'][i]===name);
  });
  if(name==='daily') renderDaily();
  if(name==='locations') renderLocations();
  if(name==='settings') renderSettings();
  if(name==='report') renderReport();
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) {
  const modal=document.getElementById(id);
  if(modal) modal.classList.remove('open');
}

// ── Daily ─────────────────────────────────────────────────
function renderDaily() {
  try { _renderDaily(); }
  catch(e) {
    const el=document.getElementById('panel-daily');
    if(el) el.innerHTML=`<div class="card" style="border-left:4px solid red;padding:20px"><b>表示エラー:</b> ${e.message}<br><small style="color:#999">${e.stack||''}</small></div>`;
    console.error('renderDaily error:',e);
  }
}
// 行き先がまだ選ばれていない便（集計・レポートには入れない）
function isComplete(t) { return t.manualDistance!=null || t.route.every(Boolean); }
// 便を新しく作るときの最初のルート
function defRoute(type) { return type==='dropoff'?['facility','','home']:['facility','','facility']; }
const BOX_COLOR={pickup:'#1a5276',dropoff:'#6c3483',outing:'#1e8449'};

// 場所の選択肢を種類ごとの見出し（optgroup）で区切る。並び順は場所マスタの順
const LOC_GROUPS=[['事業所・自宅',['facility','home']],['学校・保育園',['school']],['児童宅',['child_home']],['その他',['other']]];
function locOptions(val) {
  const known=LOC_GROUPS.flatMap(g=>g[1]);
  return LOC_GROUPS.map(([label,types],gi)=>{
    const ls=state.locations.filter(l=>types.includes(l.type)||(gi===LOC_GROUPS.length-1&&!known.includes(l.type)));
    if(!ls.length) return '';
    return `<optgroup label="${label}">${ls.map(l=>`<option value="${l.id}"${l.id===val?' selected':''}>${l.name}</option>`).join('')}</optgroup>`;
  }).join('');
}
// 日次入力は「種類 → 名前」の2段階で選ぶ
const CAT_TYPES={fh:['facility','home'],school:['school'],child:['child_home'],other:['other']};
const CAT_LABEL={fh:'事業所・自宅',school:'学校',child:'児童宅',other:'その他'};
let binCat={};   // まだ名前を選んでいない欄の「種類」（画面だけの状態）
function catOf(locId) {
  const l=state.locations.find(x=>x.id===locId);
  if(!l) return null;
  for(const k in CAT_TYPES) if(CAT_TYPES[k].includes(l.type)) return k;
  return 'other';
}
function defaultCat(type,s,n) {
  if(s===0||s===n-1) return 'fh';
  if(type==='pickup') return 'school';
  if(type==='dropoff') return 'child';
  return state.locations.some(l=>catOf(l.id)==='other')?'other':'school';
}
function stopSelect(type,idx,s,val,n) {
  const cat=(val&&catOf(val))||binCat[`${currentDate}|${idx}|${s}`]||defaultCat(type,s,n);
  const catSel=`<select class="bin-cat" onchange="updBinCat('${type}',${idx},${s},this.value)">${Object.keys(CAT_LABEL).map(k=>`<option value="${k}"${k===cat?' selected':''}>${CAT_LABEL[k]}</option>`).join('')}</select>`;
  const ls=state.locations.filter(l=>catOf(l.id)===cat);
  const nameSel=`<select onchange="updBin('${type}',${idx},${s},this.value)"${val?'':' class="empty"'}><option value=""${val?'':' selected'}>${ls.length?'（選ぶ）':'（登録なし）'}</option>${ls.map(l=>`<option value="${l.id}"${l.id===val?' selected':''}>${l.name}</option>`).join('')}${cat!=='fh'?'<option value="__new">＋ 新しく登録する…</option>':''}</select>`;
  return catSel+nameSel;
}
function updBinCat(type,idx,s,cat) {
  const t=binTrip(type,idx);
  const realIdx=state.records[currentDate].indexOf(t);
  // 種類を変えたら、違う種類の名前は外して選び直してもらう
  if(t.route[s] && catOf(t.route[s])!==cat) t.route[s]='';
  binCat[`${currentDate}|${realIdx}|${s}`]=cat;
  saveState(); renderDaily();
}
function renderBin(type,trip,idx,no) {
  const n=trip.route.length;
  const stops=trip.route.map((v,s)=>{
    const isFirst=s===0, isLast=s===n-1;
    const lbl=isFirst?'始点':isLast?'終点':`経由${'①②③④⑤⑥⑦⑧'[s-1]||s}`;
    const rm=(!isFirst&&!isLast&&n>3)?`<button class="bin-x" title="この経由地を消す" onclick="rmBinStop('${type}',${idx},${s})">×</button>`:'<span class="bin-x-sp"></span>';
    return `<div class="bin-stop"><span class="bin-lbl">${lbl}</span>${stopSelect(type,idx,s,v,n)}${rm}</div>`;
  }).join('');
  const done=isComplete(trip);
  let info='';
  if(!done){
    info='<div class="bin-warn">行き先を選んでください（選ぶまで合計には入りません）</div>';
  } else {
    const c=calcTrip(trip);
    info=`<div class="bin-sum"><span>${D(c.distance)}${c.manual?' <span style="color:#888">(手入力)</span>':''}</span><span>送迎 ¥${N(c.sendAmt)}</span><b style="color:var(--ok)">支給 ¥${N(c.paidAmt)}</b></div>
      ${c.missing.length?`<div class="bin-warn">⚠ 距離未設定: ${legsTxt(c.missing)}（「詳細」から手入力できます）</div>`:''}
      ${c.unconf.length?`<div class="bin-warn">⚠ 距離が未確認: ${legsTxt(c.unconf)}</div>`:''}
      ${c.ded>0?`<div class="dn">${c.startsHome?'自宅出発':''}${c.startsHome&&c.endsHome?' / ':''}${c.endsHome?'直帰':''} → 通勤費 -¥${N(c.ded)} 控除</div>`:''}`;
  }
  return `<div class="bin${done?'':' bin-new'}">
    <div class="bin-h"><b>${no}便目</b>
      <span style="display:flex;gap:4px">
        ${idx>=0?`<button class="btn bs sm" onclick="editTrip('${currentDate}',${idx})">詳細</button><button class="btn bd2 sm" onclick="delTrip('${currentDate}',${idx})">削除</button>`:''}
      </span></div>
    ${stops}
    <button class="btn bs sm" style="margin:2px 0 6px 46px" onclick="addBinStop('${type}',${idx})">＋ 経由地を追加</button>
    ${info}
  </div>`;
}

function _renderDaily() {
  const trips=state.records[currentDate]||[];
  let totD=0,totS=0,totP=0;
  trips.filter(isComplete).forEach(t=>{ const c=calcTrip(t); totD+=c.distance; totS+=c.sendAmt; totP+=c.paidAmt; });

  const boxes=['pickup','dropoff','outing'].map(type=>{
    const list=trips.map((t,i)=>({t,i})).filter(x=>x.t.type===type);
    // まだ1便もないときは、空の便を1つ出しておく（選んだ時点で保存）
    const items=list.length?list:[{t:{type,route:defRoute(type),manualDistance:null},i:-1}];
    let bd=0,bs=0,bp=0;
    list.filter(x=>isComplete(x.t)).forEach(x=>{ const c=calcTrip(x.t); bd+=c.distance; bs+=c.sendAmt; bp+=c.paidAmt; });
    const nDone=list.filter(x=>isComplete(x.t)).length;
    return `<div class="box" style="border-top-color:${BOX_COLOR[type]}">
      <div class="box-h"><span style="color:${BOX_COLOR[type]}">${type==='outing'?'外出・公園等':typeName(type)}</span>
        <small>${nDone?`${nDone}便 ／ ${D(bd)} ／ 支給 ¥${N(bp)}`:list.length?'行き先を選んでください':'まだありません'}</small></div>
      ${items.map((x,k)=>renderBin(type,x.t,x.i,k+1)).join('')}
      <button class="btn bp sm" style="width:100%;justify-content:center" onclick="addBin('${type}')">＋ 便を追加</button>
    </div>`;
  }).join('');

  document.getElementById('panel-daily').innerHTML=`
    <div class="card">
      <div class="dn-wrap" style="margin-bottom:0">
        <button class="btn bs sm" onclick="chgDate(-1)">◀</button>
        <input type="date" value="${currentDate}" onchange="setDate(this.value)">
        <button class="btn bs sm" onclick="chgDate(1)">▶</button>
        <button class="btn bs sm" onclick="setDate(todayStr())">今日</button>
      </div>
    </div>
    <div class="boxes">${boxes}</div>
    ${trips.some(isComplete)?`<div class="card">
      <div class="ct">📊 本日の合計</div>
      <div class="fr c3">
        <div style="text-align:center"><div style="font-size:11px;color:#888">走行距離合計</div><div style="font-size:22px;font-weight:bold">${D(totD)}</div></div>
        <div style="text-align:center"><div style="font-size:11px;color:#888">送迎金額合計</div><div style="font-size:22px;font-weight:bold">¥${N(totS)}</div></div>
        <div style="text-align:center"><div style="font-size:11px;color:#888">支給金額合計</div><div style="font-size:22px;font-weight:bold;color:var(--ok)">¥${N(totP)}</div></div>
      </div>
    </div>`:''}`;
}

function chgDate(d) { const [y,m,dd]=currentDate.split('-').map(Number); const dt=new Date(y,m-1,dd+d); currentDate=ymd(dt); renderDaily(); }
function setDate(v) { currentDate=v; renderDaily(); }

// ── 日次入力：枠の中で直接編集 ──────────────────────────────
// idx=-1 は「まだ保存していない空の便」。触った時点で記録に追加する
function binTripPeek(type,idx) { const l=state.records[currentDate]||[]; return idx>=0?l[idx]:null; }
function binTrip(type,idx) {
  if(!state.records[currentDate]) state.records[currentDate]=[];
  const list=state.records[currentDate];
  if(idx>=0 && list[idx]) return list[idx];
  const t={type,route:defRoute(type),manualDistance:null};
  list.push(t);
  return t;
}
function updBin(type,idx,s,v) {
  if(v==='__new'){
    // 「＋ 新しく登録」：場所の登録画面を開き、登録後にこの欄へ入れる
    const t0=binTripPeek(type,idx), route=t0?t0.route:defRoute(type), val=route[s];
    const curCat=(val&&catOf(val))||binCat[`${currentDate}|${idx}|${s}`]||defaultCat(type,s,route.length);
    renderDaily();
    addLocTarget={type,idx,s};
    openAddLoc({school:'school',child:'child_home',other:'other'}[curCat]||'other');
    return;
  }
  const t=binTrip(type,idx);
  t.route[s]=v;
  saveState(); renderDaily();
}
function addBinStop(type,idx) {
  const t=binTrip(type,idx);
  if(t.route.length>=10){ alert('経由地はこれ以上追加できません'); return; }
  t.route.splice(t.route.length-1,0,'');
  saveState(); renderDaily();
}
function rmBinStop(type,idx,s) {
  const t=binTrip(type,idx);
  t.route.splice(s,1);
  saveState(); renderDaily();
}
function addBin(type) {
  const list=state.records[currentDate]||[];
  // 空の便しか表示されていない枠なら、それを保存してからもう1便足す
  if(!list.some(t=>t.type===type)) binTrip(type,-1);
  binTrip(type,-1);
  saveState(); renderDaily();
}

function addTrip(type) {
  eTripEdit=null; eTripType=type; eTripManual=null;
  eTripRoute=type==='dropoff'?['home','facility']:['facility','facility'];
  openTripModal();
}
function editTrip(date,idx) {
  eTripEdit={date,idx};
  const t=state.records[date][idx];
  eTripType=t.type; eTripRoute=[...t.route]; eTripManual=t.manualDistance??null;
  openTripModal();
}
function delTrip(date,idx) {
  const t=state.records[date][idx];
  if(t && isComplete(t) && !confirm('この便を削除しますか？')) return;
  state.records[date].splice(idx,1);
  saveState();
  setTimeout(()=>renderDaily(), 50);
}

  const manEl=document.getElementById('et-manual');

// ── 場所の並べ替え（ドラッグ）。マウスでも指でも動くようにPointer Eventsを使う ──
let locDrag=null;
function initLocDrag() {
  document.querySelectorAll('#loc-tbody tr:not([data-fixed]) .dh').forEach(h=>h.addEventListener('pointerdown',startLocDrag));
}
function startLocDrag(e) {
  if(e.button>0) return;
  e.preventDefault();
  const tr=e.currentTarget.closest('tr');
  locDrag={tr,target:null,after:false,x:e.clientX,y:e.clientY,timer:null};
  tr.classList.add('dragging');
  document.body.classList.add('is-dragging');
  document.addEventListener('pointermove',moveLocDrag);
  document.addEventListener('pointerup',endLocDrag);
  document.addEventListener('pointercancel',endLocDrag);
  // 画面の端に近づけたら自動でスクロール
  locDrag.timer=setInterval(()=>{
    if(!locDrag) return;
    const m=70, y=locDrag.y;
    if(y<m) window.scrollBy(0,-Math.ceil((m-y)/4));
    else if(y>innerHeight-m) window.scrollBy(0,Math.ceil((y-(innerHeight-m))/4));
    findLocDrop(locDrag.x,y);
  },30);
}
function moveLocDrag(e) {
  if(!locDrag) return;
  locDrag.x=e.clientX; locDrag.y=e.clientY;
  findLocDrop(e.clientX,e.clientY);
}
function findLocDrop(x,y) {
  document.querySelectorAll('#loc-tbody tr.drop-before,#loc-tbody tr.drop-after').forEach(r=>r.classList.remove('drop-before','drop-after'));
  const rows=[...document.querySelectorAll('#loc-tbody tr:not([data-fixed])')];
  if(!rows.length) return;
  // 指の高さに一番近い行を探す（横にはみ出しても反応するように）
  let tr=null, after=false;
  for(const r of rows){
    const rc=r.getBoundingClientRect();
    if(y<rc.top+rc.height/2){ tr=r; after=false; break; }
    tr=r; after=true;
  }
  if(tr===locDrag.tr){ locDrag.target=null; return; }
  locDrag.target=tr; locDrag.after=after;
  tr.classList.add(after?'drop-after':'drop-before');
}
function endLocDrag() {
  if(!locDrag) return;
  clearInterval(locDrag.timer);
  document.removeEventListener('pointermove',moveLocDrag);
  document.removeEventListener('pointerup',endLocDrag);
  document.removeEventListener('pointercancel',endLocDrag);
  document.body.classList.remove('is-dragging');
  const {tr,target,after}=locDrag;
  locDrag=null;
  tr.classList.remove('dragging');
  if(!target){ document.querySelectorAll('#loc-tbody tr').forEach(r=>r.classList.remove('drop-before','drop-after')); return; }
  const scrollY=window.scrollY;
  moveLocTo(tr.dataset.id,target.dataset.id,after);
  window.scrollTo(0,scrollY);
}
function moveLocTo(id,targetId,after) {
  const locs=state.locations;
  const i=locs.findIndex(l=>l.id===id);
  if(i<0||id===targetId) return;
  const [item]=locs.splice(i,1);
  let j=locs.findIndex(l=>l.id===targetId);
  if(j<0){ locs.splice(i,0,item); return; }
  locs.splice(after?j+1:j,0,item);
  saveState(); renderLocations();
}

function setDist(a,b,v) {
  const km=parseFloat(v);
  const k1=a+'|'+b, k2=b+'|'+a;
  if(isNaN(km)||v==='') { delete state.distances[k1]; delete state.distances[k2]; delete state.manualDist[k1]; delete state.manualDist[k2]; }
  else { state.distances[k1]=km; state.distances[k2]=km; state.manualDist[k1]=true; state.manualDist[k2]=true; }
  saveState(); renderLocations();
}

// 「36.18011, 139.96327」形式（Googleマップのコピー）を読み取る
function parseLatLon(v) {
  const m=String(v).replace(/[，、]/g,',').match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
  if(!m) return null;
  let lat=parseFloat(m[1]), lon=parseFloat(m[2]);
  if(lat>100){ [lat,lon]=[lon,lat]; }   // 経度,緯度の順で貼られた場合
  if(lat<20||lat>46||lon<122||lon>154) return null;   // 日本の範囲外
  return {lat,lon};
}
// 自動計算した距離だけ消す（手入力した距離は残す）
function clearAutoDistFor(id) {
  Object.keys(state.distances).forEach(k=>{
    const [a,b]=k.split('|');
    if((a===id||b===id) && !state.manualDist[k]){ delete state.distances[k]; delete state.confirmedDist[k]; }
  });
}
function saveEditLoc() {
  const id=document.getElementById('edit-loc-id').value;
  const loc=state.locations.find(l=>l.id===id);
  if(!loc) return;
  const posEl=document.getElementById('edit-loc-pos');
  const posVal=posEl.value.trim();
  const posChanged=posVal!==posEl.dataset.orig;
  let pin=null;
  if(posChanged && posVal!==''){
    pin=parseLatLon(posVal);
    if(!pin){ alert('位置の形式が正しくありません。\n例: 36.18011, 139.96327'); return; }
  }
  const isFixed=loc.type==='facility'||loc.type==='home';
  if(!isFixed) loc.name=document.getElementById('edit-loc-name').value.trim()||loc.name;
  // 住所が変更された場合、この場所の座標と距離データを削除（再計算させる）
  onAddrChanged(loc, document.getElementById('edit-loc-address').value.trim());
  if(posChanged){
    if(pin){
      Object.assign(loc,{lat:pin.lat,lon:pin.lon,geoManual:true,geoRough:false,geoAddr:loc.address});
      delete loc.geoFailed; delete loc.snapM;
    } else {
      delete loc.lat; delete loc.lon; delete loc.geoManual; delete loc.geoAddr;
    }
    clearAutoDistFor(id);
  }
  saveState(); closeModal('edit-loc-modal');
  setTimeout(()=>renderLocations(), 50);
}

function delLoc(id) {

}

async function saveLocation() {
  const name=document.getElementById('loc-name').value.trim();
  if(!name){ alert('名前を入力してください'); return; }
  if(state.locations.some(l=>l.name===name) && !confirm(`「${name}」はすでに登録されています。同じ名前でもう1つ登録しますか？`)) return;

  if(pos==='__top') at=locs.filter(l=>l.type==='facility'||l.type==='home').length;
  else if(pos!=='__end'){ const k=locs.findIndex(l=>l.id===pos); if(k>=0) at=k+1; }

  const t=binTrip(target.type,target.idx);

    showToast(`「${name}」を登録しました。距離を計算しています…`);

  } else {
    showToast(`「${name}」を登録しました。住所がないので、距離は「場所マスタ」で入れてください。`);
  }
}

// Excelの読み書きはSheetJS。使うときだけ読み込む
let xlsxLoading=null;
function loadXLSX() {
  if(window.XLSX) return Promise.resolve();
  if(!xlsxLoading) xlsxLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res; s.onerror=()=>{ xlsxLoading=null; rej(new Error('Excel読み込み用の部品を取得できませんでした。インターネットにつながっているか確認してください。')); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}
const LOC_TYPE_JP={school:'学校',child_home:'児童宅',other:'その他'};
function guessLocType(typeText,name) {
  const t=String(typeText||'').trim();
  if(t){
    if(/学校|保育|園|学園|小|中|高/.test(t)) return 'school';
    if(/児童|宅|家|自宅/.test(t)) return 'child_home';
    return 'other';
  }
  if(/宅$/.test(name)) return 'child_home';
  if(/学校|保育園|こども園|幼稚園|学園/.test(name)) return 'school';
  return 'other';
}
function saveXlsx(rows,filename) {
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:20},{wch:10},{wch:40}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'場所マスタ');
  XLSX.writeFile(wb,filename);
}
async function downloadLocTemplate() {
  try { await loadXLSX(); } catch(e){ alert(e.message); return; }
  saveXlsx([['名前','種別','住所'],['○○小学校','学校','茨城県筑西市○○123'],['山田宅','児童宅','茨城県筑西市○○45-6'],['○○公園','その他','茨城県筑西市○○']],'場所マスタ_ひな形.xlsx');
}
async function exportLocExcel() {
  try { await loadXLSX(); } catch(e){ alert(e.message); return; }
  const rows=[['名前','種別','住所']];

function importLocExcel() {
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.xlsx,.xls,.csv';
  inp.onchange=async e=>{
    const file=e.target.files[0];
    if(!file) return;
    try {
      await loadXLSX();
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      applyLocRows(rows);
    } catch(err){ alert('読み込みに失敗しました: '+err.message); }
  };
  inp.click();
}
function applyLocRows(rows) {
  rows=rows.map(r=>r.map(c=>String(c??'').trim()));
  // 見出し行から列を探す。見つからなければ A=名前, B=種別, C=住所
  let col={name:0,type:1,addr:2}, start=0;
  const hi=rows.findIndex(r=>r.some(c=>/名前|名称|氏名|施設名|学校名/.test(c)));
  if(hi>=0 && hi<5){
    const h=rows[hi], f=re=>h.findIndex(c=>re.test(c));
    col={name:f(/名前|名称|氏名|施設名|学校名/), type:f(/種別|種類|区分/), addr:f(/住所|所在地/)};
    start=hi+1;
  }
  const items=[];
  for(const r of rows.slice(start)){
    const name=r[col.name]||'';
    if(!name) continue;
    items.push({name, type:guessLocType(col.type>=0?r[col.type]:'',name), address:col.addr>=0?(r[col.addr]||''):''});
  }
  if(!items.length){ alert('登録できる行が見つかりませんでした。\n1行目に「名前」「種別」「住所」の見出しを入れてください。'); return; }
  const byName=new Map(state.locations.map(l=>[l.name,l]));
  const seen=new Set();
  const toAdd=[], toUpd=[];
  let same=0;
  for(const it of items){
    if(seen.has(it.name)) continue;
    seen.add(it.name);
    const ex=byName.get(it.name);
    if(!ex) toAdd.push(it);
    else if(it.address && ex.address!==it.address && ex.type!=='facility' && ex.type!=='home') toUpd.push([ex,it.address]);
    else same++;
  }
  const cnt=t=>toAdd.filter(x=>x.type===t).length;
  let msg=`Excelから ${seen.size}件 読み込みました。\n\n`+
    `・新しく追加: ${toAdd.length}件（学校 ${cnt('school')}／児童宅 ${cnt('child_home')}／その他 ${cnt('other')}）\n`+
    `・住所を新しくする: ${toUpd.length}件\n・すでに同じ内容: ${same}件（何もしません）`;
  if(toUpd.length) msg+='\n\n住所を新しくする場所:\n'+toUpd.slice(0,10).map(([l,a])=>`　${l.name}: ${l.address||'（なし）'} → ${a}`).join('\n')+(toUpd.length>10?`\n　ほか${toUpd.length-10}件`:'');
  if(!toAdd.length && !toUpd.length){ alert(msg); return; }
  if(!confirm(msg+'\n\nこの内容で登録しますか？')) return;
  // 種別ごとに、同じ種別の一番下に追加する
  for(const it of toAdd){
    const locs=state.locations;
    let at=-1;
    for(let i=locs.length-1;i>=0;i--) if(locs[i].type===it.type){ at=i+1; break; }
    if(at<0) at=locs.length;
    locs.splice(at,0,{id:'loc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), ...it});
  }
  toUpd.forEach(([l,a])=>onAddrChanged(l,a));
  saveState(); renderLocations();
  alert(`登録しました。\n追加 ${toAdd.length}件／住所更新 ${toUpd.length}件\n\n下の「距離マトリクス」の「未設定の距離を住所から自動計算」を押すと、新しい場所の距離を計算します。`);
}

function showToast(msg) {
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('show');

}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// 通信が一時的に失敗しても数回やり直す
async function fetchJSON(url, tries=3) {
  let lastErr;
  for(let i=0;i<tries;i++){
    try {
      const r=await fetch(url);
      if(r.ok) return await r.json();
      lastErr=new Error('HTTP '+r.status);
      if(r.status===400) break;   // リクエスト自体が不正ならやり直しても無駄
    } catch(e){ lastErr=e; }
    await sleep(1500*(i+1));
  }
  throw lastErr;
}

async function geocodeGSI(address) {
  // 国土地理院ジオコーディングAPI（日本政府、無料、CORS対応）
  const d=await fetchJSON(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(address)}`);
  if(d&&d.length>0){
    const [lon,lat]=d[0].geometry.coordinates;
    const title=d[0].properties?.title||'';
    // 結果に番地の数字が無い＝町名までしか特定できていない
    return {lat,lon,title,rough:!/[0-9０-９]/.test(title)};
  }
  return null;
}

// OSRMの距離表API：1回で多数の区間をまとめて計算（1リクエスト最大100地点）
const OSRM_CHUNK=50;
async function osrmTable(srcLocs, dstLocs) {
  const same=srcLocs===dstLocs;
  const all=same?srcLocs:[...srcLocs,...dstLocs];
  const coords=all.map(l=>`${(+l.lon).toFixed(6)},${(+l.lat).toFixed(6)}`).join(';');
  let q='annotations=distance';
  if(!same){
    q+='&sources='+srcLocs.map((_,i)=>i).join(';');
    q+='&destinations='+dstLocs.map((_,i)=>i+srcLocs.length).join(';');
  }
  const d=await fetchJSON(`https://router.project-osrm.org/table/v1/driving/${coords}?${q}`);
  if(d.code!=='Ok') throw new Error(d.message||d.code);
  // 住所の点から最寄りの道路までの距離（大きいと位置がずれている可能性）
  (d.sources||[]).forEach((s,i)=>{ srcLocs[i].snapM=s.distance; });
  (d.destinations||[]).forEach((s,i)=>{ dstLocs[i].snapM=s.distance; });
  return d.distances;
}

// quiet=true：日次入力などから裏で呼ぶとき（メッセージを出さない）
async function autoCalcDist(btn, recalcAll, quiet) {
  const hasPos=l=>l.lat!=null && (l.geoManual || l.geoAddr===l.address);
  const withAddr=state.locations.filter(l=>l.address || l.geoManual);
  if(withAddr.length<2){ if(quiet) return; alert('住所が登録されている場所が2か所以上必要です。\n各場所に住所を登録してください。'); return; }
  if(recalcAll && !confirm('手入力した距離以外を、すべて住所から計算し直します。よろしいですか？')) return;
  document.querySelectorAll('#panel-locations button').forEach(b=>b.disabled=true);

  // ① ジオコーディング（住所→座標）。前回と同じ住所なら保存済みの座標を使う
  const geoFailed=[];
  const todo=withAddr.filter(l=>!hasPos(l));
  for(let i=0;i<todo.length;i++){
    const loc=todo[i];
    btn.textContent=`住所の位置を検索中... ${i+1}/${todo.length}件`;
    try {
      const c=await geocodeGSI(loc.address);
      if(c){ Object.assign(loc,{lat:c.lat,lon:c.lon,geoAddr:loc.address,geoTitle:c.title,geoRough:c.rough}); delete loc.geoFailed; }
      else { loc.geoFailed=true; geoFailed.push(loc.name); }
    } catch(e){ loc.geoFailed=true; geoFailed.push(loc.name+'（通信エラー）'); }
    await sleep(250);
  }
  withAddr.filter(l=>l.geoFailed && !todo.includes(l)).forEach(l=>geoFailed.push(l.name));
  saveState();

  // ② 計算が必要な区間を洗い出す
  const located=withAddr.filter(hasPos);
  const needKey=(a,b)=>!state.manualDist[a.id+'|'+b.id] && (recalcAll || getDist(a.id,b.id)==null);
  const groups=[];
  for(let i=0;i<located.length;i+=OSRM_CHUNK) groups.push(located.slice(i,i+OSRM_CHUNK));
  const jobs=[];
  for(let gi=0;gi<groups.length;gi++) for(let gj=gi;gj<groups.length;gj++){
    const A=groups[gi], B=groups[gj];
    const any=A.some((a,ai)=>B.some((b,bi)=>(gi!==gj||ai<bi)&&needKey(a,b)));
    if(any) jobs.push([gi,gj]);
  }

  // ③ OSRMでまとめて道のり距離を計算
  let ok=0, ng=0, netErr=false;
  for(let k=0;k<jobs.length;k++){
    const [gi,gj]=jobs[k];
    const A=groups[gi], B=gi===gj?A:groups[gj];
    btn.textContent=`道のり距離を計算中... ${k+1}/${jobs.length}`;
    let m;
    try { m=await osrmTable(A,B); }
    catch(e){
      netErr=true;
      A.forEach((a,ai)=>B.forEach((b,bi)=>{ if((gi!==gj||ai<bi)&&needKey(a,b)) ng++; }));
      continue;
    }
    A.forEach((a,ai)=>B.forEach((b,bi)=>{
      if(gi===gj&&ai>=bi) return;
      if(!needKey(a,b)) return;
      const meters=m[ai]?.[bi];
      if(meters==null){ ng++; return; }
      const km=Math.round(meters/100)/10;
      state.distances[a.id+'|'+b.id]=km; state.distances[b.id+'|'+a.id]=km;
      ok++;
    }));
    await sleep(500);
  }

  saveState(); renderLocations();

  const rough=located.filter(l=>l.geoRough).map(l=>l.name);
  const far=located.filter(l=>!l.geoRough && l.snapM>300).map(l=>l.name);
  const noAddr=state.locations.filter(l=>!l.address).map(l=>l.name);
  const li=a=>a.map(x=>`<li>${x}</li>`).join('');
  let html=`<div class="ib ${ng||geoFailed.length?'iw':'ic'}" style="margin-bottom:12px">
    <div style="font-weight:bold;margin-bottom:4px">${ng||geoFailed.length?'⚠ 一部計算できませんでした':'✅ 距離の自動計算が完了しました'}</div>
    <div>計算できた区間: ${ok}区間${ng?` ／ <b style="color:var(--acc)">失敗: ${ng}区間</b>`:''}${!jobs.length?'（新しく計算が必要な区間はありませんでした）':''}</div>`;
  if(netErr) html+=`<div style="font-size:12px;margin-top:4px">距離計算サーバーが混み合っている可能性があります。少し時間をおいて、もう一度「未設定の距離を住所から自動計算」を押してください（計算済みの区間はそのまま残ります）。</div>`;
  if(geoFailed.length) html+=`<div style="font-size:12px;margin-top:6px"><b>住所から位置が見つからなかった場所</b>（住所を見直すか、距離を手入力してください）<ul style="margin-left:18px">${li(geoFailed)}</ul></div>`;
  if(rough.length) html+=`<div style="font-size:12px;margin-top:6px"><b>おおまかな位置で計算した場所</b>（番地まで入れると正確になります）<ul style="margin-left:18px">${li(rough)}</ul></div>`;
  if(far.length) html+=`<div style="font-size:12px;margin-top:6px"><b>位置がずれているかもしれない場所</b>（「地図で位置を確認」で確かめてください）<ul style="margin-left:18px">${li(far)}</ul></div>`;
  if(noAddr.length) html+=`<div style="font-size:12px;margin-top:6px"><b>住所が未登録の場所</b>：${noAddr.join('、')}</div>`;
  html+='</div>';
  const st=document.getElementById('calc-status');
  if(st){ st.innerHTML=html; st.scrollIntoView({behavior:'smooth',block:'center'}); }
}

function toggleRateMode(useFixed) {
  state.settings.useFixedRate=useFixed;
  document.getElementById('fixed-rate-section').style.display=useFixed?'block':'none';
  document.getElementById('fuel-section').style.display=useFixed?'none':'block';
  prvRate();
}
function prvRate() {
  const useFixed=state.settings.useFixedRate;
  let rate;
  if(useFixed){
    rate=parseFloat(document.getElementById('s-fixed-rate')?.value)||0;
    const el=document.getElementById('s-rate'); if(el) el.textContent=rate+' 円/km';
  } else {
    const fp=parseFloat(document.getElementById('s-fp')?.value)||0;
    const fe=parseFloat(document.getElementById('s-fe')?.value)||1;
    rate=fe>0?Math.ceil(fp/fe):0;
    const el=document.getElementById('s-rate-fuel'); if(el) el.textContent=rate+' 円/km';
  }
  const cd=parseFloat(document.getElementById('s-cd')?.value)||0;
  const cr=parseFloat(document.getElementById('s-cr')?.value)||0;
  const el2=document.getElementById('s-ded'); if(el2) el2.textContent='¥'+N(Math.round(cd*cr));
  autoSaveSettings();
}

function autoSaveSettings() {
  const s=state.settings;
  s.facilityName=document.getElementById('s-fac')?.value.trim()||'';
  s.staffName=document.getElementById('s-staff')?.value.trim()||'';
  s.commuteDistance=parseFloat(document.getElementById('s-cd')?.value)||0;
  s.commuteRate=parseFloat(document.getElementById('s-cr')?.value)||0;
  const homeLoc=state.locations.find(l=>l.id==='home');
  if(homeLoc) onAddrChanged(homeLoc, document.getElementById('s-home-addr')?.value.trim()||'');
  if(s.useFixedRate){
    s.fixedRate=parseFloat(document.getElementById('s-fixed-rate')?.value)||0;
  } else {
    s.fuelPrice=parseFloat(document.getElementById('s-fp')?.value)||0;
    s.fuelEfficiency=parseFloat(document.getElementById('s-fe')?.value)||1;
  }
  saveState();
}

function saveSettings() {
  const s=state.settings;
  s.facilityName=document.getElementById('s-fac').value.trim();
  s.staffName=document.getElementById('s-staff').value.trim();
  s.commuteDistance=parseFloat(document.getElementById('s-cd').value)||0;
  s.commuteRate=parseFloat(document.getElementById('s-cr').value)||0;
  const homeLoc=state.locations.find(l=>l.id==='home');
  if(homeLoc) onAddrChanged(homeLoc, document.getElementById('s-home-addr').value.trim());
  if(s.useFixedRate){
    s.fixedRate=parseFloat(document.getElementById('s-fixed-rate').value)||0;
  } else {
    s.fuelPrice=parseFloat(document.getElementById('s-fp').value)||0;
    s.fuelEfficiency=parseFloat(document.getElementById('s-fe').value)||1;
  }
  saveState(); alert('設定を保存しました。');
}

function resetAll() {
  if(!confirm('すべてのデータをリセットしますか？この操作は元に戻せません。')) return;
  state=defaultState(); saveState(); renderSettings(); alert('リセットしました。');
}

// ── 場所マスタを配布用ファイルで渡す ─────────────────────
// 書き出すもの：場所・住所・位置・距離・確認済みの印・単価設定
// 書き出さないもの：自宅の住所と自宅がからむ距離、担当者名、通勤距離、送迎記録
const PACK_KIND='sougeicalc-locations';
function exportLocPack() {
  const noHome=obj=>Object.fromEntries(Object.entries(obj||{}).filter(([k])=>!k.split('|').includes('home')));
  const s=state.settings;
  const pack={
    kind:PACK_KIND, version:1, createdAt:new Date().toISOString(),
    settings:{facilityName:s.facilityName,fuelPrice:s.fuelPrice,fuelEfficiency:s.fuelEfficiency,fixedRate:s.fixedRate,useFixedRate:s.useFixedRate,commuteRate:s.commuteRate},
    locations:state.locations.map(l=>{
      if(l.id==='home') return {id:'home',name:'自宅',type:'home',address:''};
      const {geoFailed,...rest}=l; return rest;
    }),
    distances:noHome(state.distances), manualDist:noHome(state.manualDist), confirmedDist:noHome(state.confirmedDist)
  };
  const blob=new Blob([JSON.stringify(pack,null,1)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`場所マスタ_配布用_${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
  const n=state.locations.length-2;
  alert(`配布用ファイルを書き出しました（場所 ${n}件、距離 ${Object.keys(pack.distances).length/2}区間）。\n\n自宅の住所は入っていません。\n児童の住所が入っているので、LINEやメール、社内の共有フォルダなど、関係者だけが見られる方法で渡してください。`);
}
function importLocPack() {
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try {
        const pack=JSON.parse(ev.target.result);
        if(pack.kind!==PACK_KIND || !Array.isArray(pack.locations)) throw new Error('配布用の場所マスタファイルではありません');
        applyLocPack(pack);
      } catch(err){ alert('取り込みに失敗しました: '+err.message); }
    };
    reader.readAsText(file,'utf-8');
  };
  inp.click();
}
function applyLocPack(pack) {
  const POS=['address','lat','lon','geoAddr','geoTitle','geoRough','geoManual','snapM'];
  const fresh=state.locations.every(l=>l.type==='facility'||l.type==='home');
  const idMap={home:'home'}, toAdd=[], toUpd=[];
  let same=0;
  for(const pl of pack.locations){
    if(pl.id==='home') continue;
    let ex=state.locations.find(l=>l.id===pl.id && (l.name===pl.name||pl.id==='facility'));
    if(!ex) ex=state.locations.find(l=>l.name===pl.name && l.type===pl.type);
    if(ex){
      idMap[pl.id]=ex.id;
      if(POS.some(k=>(ex[k]??'')!==(pl[k]??''))) toUpd.push([ex,pl]); else same++;
    } else toAdd.push(pl);
  }
  let msg=`配布用ファイル（${String(pack.createdAt||'').slice(0,10)} 作成）を取り込みます。\n\n`+
    `・新しく追加する場所: ${toAdd.length}件\n・住所や位置を新しくする場所: ${toUpd.length}件\n・変わらない場所: ${same}件\n`+
    `・計算済みの距離: ${Object.keys(pack.distances||{}).length/2}区間\n\n`+
    `単価の設定も配布元に合わせます。\nあなたの自宅の住所、通勤距離、送迎記録、あなたが手で入れた距離はそのまま残ります。`;
  if(!confirm(msg+'\n\n取り込みますか？')) return;
  // 場所
  for(const [ex,pl] of toUpd){
    clearAutoDistFor(ex.id);
    POS.forEach(k=>{ if(pl[k]===undefined) delete ex[k]; else ex[k]=pl[k]; });
    delete ex.geoFailed;
    if(ex.type!=='facility') ex.type=pl.type;
  }
  for(const pl of toAdd){
    const id=state.locations.some(l=>l.id===pl.id)?'loc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7):pl.id;
    idMap[pl.id]=id;
    const loc={...pl,id};
    if(fresh){ state.locations.push(loc); continue; }
    // 同じ種別の一番下に入れる
    let at=-1;
    for(let i=state.locations.length-1;i>=0;i--) if(state.locations[i].type===loc.type){ at=i+1; break; }
    state.locations.splice(at<0?state.locations.length:at,0,loc);
  }
  if(fresh){
    // 初めての人は、配布元と同じ並び順にする
    const order=pack.locations.map(pl=>idMap[pl.id]||pl.id);
    state.locations.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  }
  // 距離（手で入れた距離は残す）
  let kept=0;
  for(const [k,v] of Object.entries(pack.distances||{})){
    const [a,b]=k.split('|'), la=idMap[a], lb=idMap[b];
    if(!la||!lb||la==='home'||lb==='home') continue;
    const key=la+'|'+lb;
    if(state.manualDist[key] && state.distances[key]!==v){ kept++; continue; }
    state.distances[key]=v;
    if(pack.manualDist?.[k]) state.manualDist[key]=true; else delete state.manualDist[key];
    if(pack.confirmedDist?.[k]) state.confirmedDist[key]={...pack.confirmedDist[k]};
  }
  // 単価の設定
  const ps=pack.settings||{};
  ['facilityName','fuelPrice','fuelEfficiency','fixedRate','useFixedRate','commuteRate'].forEach(k=>{ if(ps[k]!==undefined && ps[k]!=='') state.settings[k]=ps[k]; });
  saveState(); renderLocations();
  const home=state.locations.find(l=>l.id==='home');
  alert(`取り込みました。\n追加 ${toAdd.length}件／更新 ${toUpd.length}件${kept?`／手入力の距離を残した区間 ${kept}`:''}\n\n`+
    (home&&home.address?'次に「未設定の距離を住所から自動計算」を押すと、自宅からの距離が計算されます。'
      :'次に「基本設定」で自宅の住所と通勤距離を入れて、「場所マスタ」の「未設定の距離を住所から自動計算」を押してください。'));
}

function importJSON() {

    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try {
        const data=JSON.parse(ev.target.result);
        if(!data.locations||!data.settings) throw new Error('形式が正しくありません');

function importDistances() {

  inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try {
        const distances=JSON.parse(ev.target.result);

  };
  inp.click();
}

let rMonth=todayStr().slice(0,7);

function renderReport() {
  const yr=parseInt(rMonth.slice(0,4)), mo=parseInt(rMonth.slice(5,7));
  const days=new Date(yr,mo,0).getDate();
  const s=state.settings;
  const WD=['日','月','火','水','木','金','土'];
  let totD={p:0,d:0,o:0},totS={p:0,d:0,o:0},totP={p:0,d:0,o:0};
  let unconfTrips=0, missTrips=0, manualTrips=0;

  const rows=Array.from({length:days},(_,i)=>{
    const di=i+1;
    const ds=`${yr}-${String(mo).padStart(2,'0')}-${String(di).padStart(2,'0')}`;
    const trips=(state.records[ds]||[]).filter(isComplete);
    const byT={pickup:[],dropoff:[],outing:[]};
    trips.forEach(t=>(byT[t.type]||[]).push(t));

    const keys=[['pickup','p'],['dropoff','d'],['outing','o']];
    const cells=keys.map(([type,k])=>{
      const tl=byT[type];
      if(!tl.length) return `<td colspan="4" style="background:#fafafa"></td>`;
      let td=0,ts=0,tp=0,routes=[];
      tl.forEach(t=>{
        const c=calcTrip(t); td+=c.distance; ts+=c.sendAmt; tp+=c.paidAmt;
        if(c.unconf.length) unconfTrips++;
        if(c.missing.length) missTrips++;
        if(c.manual) manualTrips++;
        const mark=(c.unconf.length||c.missing.length)?' <span style="color:var(--warn)" title="未確認・未設定の距離を含む">⚠</span>':c.manual?' <span style="color:#888" title="走行距離を手入力">✎</span>':'';
        routes.push(t.route.filter(Boolean).map(locName).join('→')+mark);
      });
      totD[k]+=td; totS[k]+=ts; totP[k]+=tp;
      return `<td style="text-align:left;font-size:11px">${routes.join('<br>')}</td><td>${D(td)}</td><td>¥${N(ts)}</td><td>¥${N(tp)}</td>`;
    });

    const dow=new Date(ds).getDay();
    const wknd=dow===0||dow===6;
    return `<tr style="${wknd?'background:#fff8f8':''}${!trips.length?';color:#ccc':''}">
      <td style="white-space:nowrap">${di}(${WD[dow]})</td>${cells.join('')}</tr>`;
  }).join('');

  const gtD=totD.p+totD.d+totD.o, gtS=totS.p+totS.d+totS.o, gtP=totP.p+totP.d+totP.o;

          <button class="btn bok" onclick="exportCSV()">📥 CSV出力（Excel対応）</button>
        </div>
      </div>
      <div style="font-size:12px;color:#888;margin-bottom:10px">${s.facilityName||'（事業所名未設定）'} ／ 担当: ${s.staffName||'（氏名未設定）'} ／ ${yr}年${mo}月</div>
      ${unconfTrips||missTrips?`<div class="ib iw" style="margin-bottom:12px">
        <div style="font-weight:bold">⚠ この月は、まだ確認していない距離を使った送迎があります</div>
        <div style="font-size:12px;margin-top:4px">${unconfTrips?`未確認の距離を含む送迎: <b>${unconfTrips}件</b>　`:''}${missTrips?`距離が未設定の区間を含む送迎: <b>${missTrips}件</b>`:''}<br>
        支給する前に、下の「🔎 区間の確認」で距離を確かめてください。表の ⚠ が付いた送迎が対象です。</div></div>`
      :`<div class="ib ic" style="margin-bottom:12px">✅ この月に使った距離は、すべて確認済みです。${manualTrips?`（走行距離を手入力した送迎 ${manualTrips}件 は ✎ 印。内容を確認してください）`:''}</div>`}
      <div style="overflow-x:auto">
        <table class="tbl" style="font-size:12px">
          <thead>
            <tr>
              <th rowspan="2">日付</th>
              <th colspan="4" style="background:#1a5276">迎え</th>
              <th colspan="4" style="background:#6c3483">送り</th>
              <th colspan="4" style="background:#1e8449">外出</th>
            </tr>

      </div>
      <div class="ib ii" style="margin-top:12px;font-size:12px">
        燃費換算単価: ${ratePerKm()}円/km ／ 通勤費控除: ¥${N(commuteDed())} ／ 通勤距離: ${state.settings.commuteDistance}km
      </div>
    </div>
    ${renderLegCheck()}`;
}

// ── 区間の確認 ────────────────────────────────────────────
// この月の送迎で実際に使った区間を一覧にする
function monthLegs() {
  const legs={};
  Object.keys(state.records).filter(ds=>ds.startsWith(rMonth)).forEach(ds=>{
    (state.records[ds]||[]).filter(isComplete).forEach(t=>{
      if(t.manualDistance!=null) return;
      const r=t.route.filter(Boolean);
      for(let i=0;i<r.length-1;i++){
        const a=r[i], b=r[i+1];
        if(a===b) continue;
        const k=[a,b].sort().join('|');
        if(!legs[k]) legs[k]={a,b,count:0};
        legs[k].count++;
      }
    });
  });
  return Object.values(legs);
}
function gmapsDir(a,b) {
  const pt=id=>{ const l=state.locations.find(x=>x.id===id)||{}; return l.lat!=null?`${l.lat},${l.lon}`:(l.address||l.name||''); };
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(pt(a))}&destination=${encodeURIComponent(pt(b))}&travelmode=driving`;
}
function renderLegCheck() {
  const legs=monthLegs();
  // 未確認を上に
  legs.sort((x,y)=>isConfirmed(x.a,x.b)-isConfirmed(y.a,y.b)||y.count-x.count);
  const nUn=legs.filter(l=>!isConfirmed(l.a,l.b)).length;
  const rows=legs.map((l,i)=>{
    const d=getDist(l.a,l.b), conf=isConfirmed(l.a,l.b), c=confirmInfo(l.a,l.b);
    const man=state.manualDist[l.a+'|'+l.b];
    return `<tr style="${conf?'':'background:#fffaf0'}">
      <td style="text-align:left">${locName(l.a)} ↔ ${locName(l.b)}</td>
      <td>${l.count}回</td>
      <td style="white-space:nowrap"><input type="number" id="cf-${i}" step="0.1" min="0" value="${d??''}" placeholder="km" style="width:72px;padding:4px;border:1px solid var(--bd);border-radius:3px;text-align:center"> km
        <div class="hint">${d==null?'未設定':man?'手入力':'自動計算'}</div></td>
      <td><a href="${gmapsDir(l.a,l.b)}" target="_blank" rel="noopener">🗺 Googleマップ</a></td>
      <td>${conf?`<span style="color:var(--ok);font-weight:bold">✅ 確認済み</span><div class="hint">${c.at}</div>`:'<span style="color:var(--warn);font-weight:bold">⚠ 未確認</span>'}</td>
      <td>${conf?`<button class="btn bs sm" onclick="unconfirmLeg('${l.a}','${l.b}')">取り消し</button>`
        :`<button class="btn bok sm" onclick="confirmLeg('${l.a}','${l.b}','cf-${i}')">確認した</button>`}</td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <div class="ct">🔎 区間の確認（${rMonth.replace('-','年')}月に使った区間）</div>
    <div class="ib ii" style="margin-bottom:12px;font-size:12px">
      自動計算の距離は目安です。支給の前に、区間ごとに「🗺 Googleマップ」で道のりを確かめてください。<br>
      距離が違っていたら数字を直してから「確認した」を押します。確認した距離は全部の日に反映されます。<br>
      あとで距離が変わった区間（計算し直しなど）は、自動的に「未確認」に戻ります。
    </div>
    ${legs.length?`<div style="font-size:13px;margin-bottom:8px">全${legs.length}区間 ／ 未確認 <b style="color:${nUn?'var(--warn)':'var(--ok)'}">${nUn}区間</b></div>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>区間</th><th>使用</th><th>距離</th><th>地図</th><th>状態</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`:'<div style="color:#aaa;text-align:center;padding:16px">この月の送迎記録はまだありません</div>'}
  </div>`;
}
function confirmLeg(a,b,inputId) {
  const v=parseFloat(document.getElementById(inputId).value);
  if(isNaN(v)||v<0){ alert('距離（km）を入力してください'); return; }
  const k1=a+'|'+b, k2=b+'|'+a;
  if(getDist(a,b)!==v){
    state.distances[k1]=v; state.distances[k2]=v;
    state.manualDist[k1]=true; state.manualDist[k2]=true;
  }
  const info={km:v, at:todayStr()+' 確認'};
  state.confirmedDist[k1]=info; state.confirmedDist[k2]={...info};
  saveState(); renderReport();
}
function unconfirmLeg(a,b) {
  delete state.confirmedDist[a+'|'+b]; delete state.confirmedDist[b+'|'+a];
  saveState(); renderReport();
}

function setRMonth(v) { rMonth=v; renderReport(); }

function exportCSV() {
  const yr=parseInt(rMonth.slice(0,4)), mo=parseInt(rMonth.slice(5,7));
  const days=new Date(yr,mo,0).getDate();
  const s=state.settings;
  const WD=['日','月','火','水','木','金','土'];

  const header=[
    '日付','曜日',
    '迎え_ルート','迎え_走行距離(km)','迎え_送迎金額(円)','迎え_支給金額(円)',
    '送り_ルート','送り_走行距離(km)','送り_送迎金額(円)','送り_支給金額(円)',
    '外出_ルート','外出_走行距離(km)','外出_送迎金額(円)','外出_支給金額(円)',
    '未確認・未設定の区間'
  ];
  let unconfTrips=0;

  let totD={p:0,d:0,o:0},totS={p:0,d:0,o:0},totP={p:0,d:0,o:0};
  const dataRows=[];

  for(let di=1;di<=days;di++){
    const ds=`${yr}-${String(mo).padStart(2,'0')}-${String(di).padStart(2,'0')}`;
    const trips=(state.records[ds]||[]).filter(isComplete);
    const byT={pickup:trips.filter(t=>t.type==='pickup'),dropoff:trips.filter(t=>t.type==='dropoff'),outing:trips.filter(t=>t.type==='outing')};
    const dow=new Date(ds).getDay();
    const row=[ds,WD[dow]];
    const bad=[];
    [['pickup','p'],['dropoff','d'],['outing','o']].forEach(([type,k])=>{
      const tl=byT[type];
      if(!tl.length){ row.push('','','',''); }
      else {
        let td=0,ts=0,tp=0,routes=[];
        tl.forEach(t=>{
          const c=calcTrip(t); td+=c.distance; ts+=c.sendAmt; tp+=c.paidAmt;
          const legs=[...c.unconf,...c.missing];
          if(legs.length){ unconfTrips++; bad.push(legsTxt(legs)); }
          routes.push(t.route.filter(Boolean).map(locName).join('→')+(legs.length?'【未確認】':c.manual?'【距離手入力】':''));
        });
        totD[k]+=td; totS[k]+=ts; totP[k]+=tp;
        row.push(routes.join(' / '),Math.round(td*10)/10,ts,tp);
      }
    });
    row.push(bad.join(' / '));
    dataRows.push(row);
  }

  const gtD=totD.p+totD.d+totD.o, gtS=totS.p+totS.d+totS.o, gtP=totP.p+totP.d+totP.o;
  const esc=v=>`"${String(v).replace(/"/g,'""')}"`;
  const lines=[
    [`私有車使用実績報告書`],
    [`事業所: ${s.facilityName}`],
    [`担当者: ${s.staffName}`],
    [`対象月: ${yr}年${mo}月`],
    [`燃費換算単価: ${ratePerKm()}円/km`, `通勤費控除: ¥${commuteDed()}`],
    [unconfTrips?`※注意: 未確認・未設定の距離を含む送迎が${unconfTrips}件あります（右端の列を参照）`:'距離の確認: すべて確認済み'],
    [],
    header,
    ...dataRows,
    [],
    ['合計','',`迎え距離:${D(totD.p)}`,totS.p,totP.p,`送り距離:${D(totD.d)}`,totS.d,totP.d,`外出距離:${D(totD.o)}`,totS.o,totP.o],
    ['月間合計走行距離',D(gtD),'月間合計送迎金額',`¥${gtS}`,'月間合計支給金額',`¥${gtP}`]
  ].map(r=>r.map(esc).join(',')).join('\r\n');

  const blob=new Blob(['﻿'+lines],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`送迎実績_${yr}年${mo}月_${s.staffName||''}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ── Init ──────────────────────────────────────────────────
loadState();
renderDaily();
</script>
